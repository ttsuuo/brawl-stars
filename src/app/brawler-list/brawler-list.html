<div class="search-container">
    <input type="text" placeholder="Find brawler" class="brawler__search" #filter>
    <button class="brawler__search-btn" type="button" (click)="filterResults(filter.value)">Search</button>
</div>

<div class="brawler__grid">
    <article class="brawler-card" *ngFor="let brawler of filteredBrawlerList">
        <div class="brawler-card__image-wrapper">
            <img [src]="brawler.image" [alt]="brawler.name" class="brawler-card__image">
        </div>
        <div class="brawler-card__info">
            <h3 class="brawler-card__title">{{brawler.name}}</h3>
            <p class="brawler-card__rarity">Rarity: <span [style.color]="getColor(brawler.rarity)">{{brawler.rarity}}</span></p>
            <p class="brawle-cardr__class">Class: <span>{{brawler.class}}</span></p>
            <button [routerLink]="['/brawler', brawler.id ]" class="brawler-card__details">Learn more</button>
        </div>
    </article>
</div>
