<div class="search-container">
    <input type="text" placeholder="Find character" class="brawler__search" #filter>
    <button  class="brawler__search-btn" type="button" (click)="filterResults(filter.value)">Search</button>
</div>

<div class="character__grid">
    <article *ngFor="let character of characters" class="character-card">
        <app-character-card (actionClicked)="handleButtonClick(character.id)" [character]="character"></app-character-card>
    </article>
</div>

<div class="pagination-container">
    <button [disabled]="isLoading" (click)="previousPage()" class="pagination-btn prev-btn">
        <span class="arrow">&larr;</span> Назад
    </button>

    <span class="page-info">Страница {{currentPage}}</span>

    <button [disabled]="isLoading" (click)="nextPage()" class="pagination-btn next-btn">
        Вперед <span class="arrow">&rarr;</span>
    </button>
</div>
