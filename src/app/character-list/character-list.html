<div class="search-container">
    <input type="text" placeholder="Find brawler" class="brawler__search" #filter>
    <button class="brawler__search-btn" type="button" (click)="filterResults(filter.value)">Search</button>
</div>

<div class="character__grid">
    <article *ngFor="let character of filteredCharacterList" class="character-card">
        <app-character-card (actionClicked)="handleButtonClick(character.id)" [character]="character"></app-character-card>
    </article>
</div>
